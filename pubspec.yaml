name: todo
description: A new Flutter project.
publish_to: 'none'
version: 1.1.9+2

environment:
  sdk: '>=3.10.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  scrollable_positioned_list: ^0.3.8
  cupertino_icons: ^1.0.9
  intl: ^0.20.3
  image_picker: ^1.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.6
  timelines_plus: ^2.0.0
  flutter_slidable: ^4.0.3
  flutter_native_splash: ^2.4.7
  auto_route: ^9.3.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.13
  very_good_analysis: ^10.2.0
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon/todo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/defaultCategoryIcons/
    - assets/
    - assets/app_icon/


  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu/Ubuntu-Bold.ttf
        - asset: assets/fonts/Ubuntu/Ubuntu-Light.ttf     
        - asset: assets/fonts/Ubuntu/Ubuntu-Medium.ttf      
        - asset: assets/fonts/Ubuntu/Ubuntu-Regular.ttf
     
    
        # - asset: fonts/Schyler-Italic.ttf
        #   style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

